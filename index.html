"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let DPR = 1, S = 1, W = 800, H = 450, GY = 390;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  H = 450; S = cv.height / H; W = cv.width / S;

}
const rnd = (a, b) => a + Math.random() * (b - a);
// ---- world: in the arena the floor is flat (GY) and the world is the screen; in adventure mode
//      LV holds the level geometry and the camera scrolls horizontally
let LV = null, camX = 0;
function bx0() { return LV ? (LV.lock ? LV.lock.x0 : 0) : 0; }
function bx1() { return LV ? (LV.lock ? LV.lock.x1 : LV.width) : W; }
function surfAt(x, y) { // highest walkable surface at or below feet y
  if (!LV) return { y: GY, o: null };
  let best = 1e9, o = null;
  for (const list of [LV.cur, LV.planks, LV.movers]) for (const s of list)
    if (x >= s.x - 2 && x <= s.x + s.w + 2 && s.y >= y - 6 && s.y < best) { best = s.y; o = s; }
  return { y: best, o };
}
function floorAt(x, y) { return LV ? surfAt(x, y).y : GY; }
function boxHit(x, feet, h) { // does a body (16 wide, h tall) standing at feet overlap a solid?
  if (!LV) return false; h = h || 48;
  for (const s of LV.cur) if (x + 7 > s.x && x - 7 < s.x + s.w && feet - 2 > s.y && feet - h < s.y + s.h) return true;
  return false;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let k = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; k = clamp(k, 0, 1);
  return Math.hypot(px - (ax + dx * k), py - (ay + dy * k));
}

// ================== AUDIO ==================
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f1, f2, dur, type, vol) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!AC) return; const t = AC.currentTime, n = AC.sampleRate * dur | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq; s.buffer = b; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
const sfx = {
  zap() { tone(1800, 200, 0.12, 'sawtooth', 0.05); noise(0.08, 0.08, 6000); },
  hit() { noise(0.1, 0.25, 2500); tone(300, 80, 0.08, 'square', 0.05); },

  ult() { tone(90, 30, 1.2, 'sawtooth', 0.25); noise(1.1, 0.7, 700); tone(1600, 100, 0.6, 'square', 0.05); },

// ================== SCENERY ==================

const STAGES = [
  { n: 'Đêm Trăng', sky: ['#0b0f24', '#1d2350', '#3a3d7a'], orb: '#e8eeff', glow: '200,220,255', h1: '#262b5c', h2: '#171a3d', deco: '#1e2250', gr: '#0e1030', line: '#5a63c9', kind: 'towers', fx: 'stars',
    pool: { grunt: 3, archer: 2, bat: 2, brute: 1 }, boss: { n: 'CHÚA TỂ BÓNG ĐÊM', col: '#ff2d55', moves: ['swing', 'slam', 'charge', 'bdash'] } },
  { n: 'Sa Mạc Hoàng Hôn', sky: ['#2a1240', '#a8436a', '#ff9a5a'], orb: '#ffd27a', glow: '255,180,90', h1: '#7a3b4f', h2: '#4a2240', deco: '#5a2a48', gr: '#2a1428', line: '#ff9a5a', kind: 'pyramids', fx: 'sand',
    pool: { grunt: 2, archer: 1, bomber: 2, ninja: 2, brute: 1 }, boss: { n: 'VUA CÁT', col: '#ffb347', moves: ['swing', 'charge', 'bdash', 'bthrow', 'slam'] } },
  { n: 'Rừng Băng', sky: ['#08162e', '#2d5c8a', '#9fd3ef'], orb: '#f0fbff', glow: '200,240,255', h1: '#5c86b0', h2: '#33557a', deco: '#24466a', gr: '#16253d', line: '#bfefff', kind: 'pines', fx: 'snow',
    pool: { shield: 2, archer: 1, bat: 2, mage: 2, ninja: 1, grunt: 1, brute: 1 }, boss: { n: 'HIỆP SĨ BĂNG', col: '#7fe9ff', moves: ['swing', 'bdash', 'bthrow', 'bdive', 'slam', 'combo'] } },
  { n: 'Núi Lửa', sky: ['#1a0505', '#5a1010', '#d4471a'], orb: '#ff5a3a', glow: '255,90,40', h1: '#3a0f0f', h2: '#250808', deco: '#2e0b0b', gr: '#170505', line: '#ff6a2a', kind: 'volcano', fx: 'embers',
    pool: { grunt: 1, archer: 1, bomber: 2, ninja: 2, shield: 2, mage: 2, brute: 2, bat: 1 }, boss: { n: 'QUỶ LỬA', col: '#ff6a2a', moves: ['swing', 'charge', 'bdash', 'bthrow', 'bdive', 'combo', 'slam'] } },
];
const ALL_MOVES = ['swing', 'charge', 'bdash', 'bthrow', 'bdive', 'combo', 'slam'];
function crowd() { return Math.pow(1.2, stageIdx(wave)); }
function stageIdx(w) { return Math.floor((Math.max(1, w) - 1) / 5); }
function stage() { return LV ? STAGES[LV.def.stage] : STAGES[stageIdx(wave) % STAGES.length]; }
let stars = [], hills1 = [], hills2 = [], towers = [], pyramids = [], amb = [];
function makeScenery() {
  pyramids = [[W * 0.18, 110, 120], [W * 0.38, 70, 75], [W * 0.62, 130, 140], [W * 0.88, 80, 85]];
  stars = []; for (let i = 0; i < 90; i++) stars.push([Math.random() * W, Math.random() * GY * 0.75, Math.random() * 1.5 + 0.3, Math.random() * 6]);
  hills1 = []; hills2 = [];
  const k = 6.2832 / W;
  for (let x = -20; x <= W + 40; x += 20) { hills1.push([x, GY - 90 - Math.sin(x * k * 2) * 32 - Math.sin(x * k * 7) * 9]); hills2.push([x, GY - 40 - Math.sin(x * k * 3 + 2) * 20 - Math.sin(x * k * 11) * 5]); }
  towers = []; for (let x = 20; x < W; x += rnd(30, 70)) towers.push([x, rnd(20, 60), rnd(12, 26)]);
}
function drawBG() {
  const st = stage();
  const g = cx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, st.sky[0]); g.addColorStop(0.6, st.sky[1]); g.addColorStop(1, st.sky[2]);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  if (st.fx === 'stars' || st.fx === 'snow') {
    for (const s of stars) { cx.globalAlpha = (st.fx === 'snow' ? 0.25 : 0.4) + 0.5 * Math.abs(Math.sin(T * 0.8 + s[3])); cx.fillStyle = '#fff'; cx.fillRect(s[0], s[1] * 0.7, s[2], s[2]); }
    cx.globalAlpha = 1;
  }
  // moon / sun
  const sun = st.kind === 'pyramids', mx = W * (sun ? 0.7 : 0.78), my = GY * (sun ? 0.55 : 0.28), mr = sun ? 52 : 32;
  const mg = cx.createRadialGradient(mx, my, 10, mx, my, mr * 3); mg.addColorStop(0, 'rgba(' + st.glow + ',.4)'); mg.addColorStop(1, 'rgba(' + st.glow + ',0)');
  cx.fillStyle = mg; cx.beginPath(); cx.arc(mx, my, mr * 3, 0, 7); cx.fill();
  cx.fillStyle = st.orb; cx.beginPath(); cx.arc(mx, my, mr, 0, 7); cx.fill();
  if (st.kind === 'towers') { cx.fillStyle = '#cdd6f5'; cx.beginPath(); cx.arc(mx - 9, my - 6, 6, 0, 7); cx.arc(mx + 10, my + 9, 4, 0, 7); cx.fill(); }
  if (st.kind === 'volcano') drawVolcano(st);
  const off = LV ? -((camX * 0.3) % W) : 0;
  for (const ox of LV ? [off, off + W] : [0]) {
  cx.save(); cx.translate(ox, 0);
  poly(hills1, st.h1);
  cx.fillStyle = st.deco;
  if (st.kind === 'towers') for (const t of towers) cx.fillRect(t[0], GY - 40 - t[1], t[2], t[1] + 40);
  else if (st.kind === 'pyramids') for (const [x, w, h] of pyramids) {
    cx.fillStyle = st.deco; cx.beginPath(); cx.moveTo(x - w, GY - 20); cx.lineTo(x, GY - 20 - h); cx.lineTo(x + w, GY - 20); cx.fill();
    cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.moveTo(x, GY - 20 - h); cx.lineTo(x + w, GY - 20); cx.lineTo(x + w * 0.2, GY - 20); cx.fill();
  }
  else if (st.kind === 'pines') for (const t of towers) {
    const x = t[0], h = t[1] + 40, b = GY - 30;
    for (let i = 0; i < 3; i++) { const yy = b - i * h * 0.3, ww = (3 - i) * 9 + 4; cx.beginPath(); cx.moveTo(x - ww, yy); cx.lineTo(x, yy - h * 0.45); cx.lineTo(x + ww, yy); cx.fill(); }
  }
  poly(hills2, st.h2);
  cx.restore();
  }
  if (!LV) { // flat arena ground (levels draw their own terrain)
    cx.fillStyle = st.gr; cx.fillRect(0, GY, W, H - GY);
    cx.strokeStyle = st.line; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0, GY); cx.lineTo(W, GY); cx.stroke();
    cx.globalAlpha = 0.15; cx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { cx.beginPath(); cx.moveTo(x, GY + 4); cx.lineTo(x - 20, H); cx.stroke(); }
    cx.globalAlpha = 1;
  }
  // weather
  for (const a of amb) { cx.globalAlpha = Math.min(1, a.life) * 0.7; cx.fillStyle = a.col; if (st.fx === 'sand') cx.fillRect(a.x, a.y, 7, 1); else cx.fillRect(a.x, a.y, a.sz, a.sz); }
  cx.globalAlpha = 1;
}
function drawVolcano(st) {
  const x = W * 0.3, b = GY - 30, h = 190, w = 230;
  cx.fillStyle = '#2a0909'; cx.beginPath(); cx.moveTo(x - w, b); cx.lineTo(x - 30, b - h); cx.lineTo(x + 30, b - h); cx.lineTo(x + w, b); cx.fill();
  const lg = cx.createRadialGradient(x, b - h, 5, x, b - h, 70); lg.addColorStop(0, 'rgba(255,160,40,.9)'); lg.addColorStop(1, 'rgba(255,60,20,0)');
  cx.fillStyle = lg; cx.beginPath(); cx.arc(x, b - h, 70, 0, 7); cx.fill();
  cx.strokeStyle = '#ff6a2a'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(x - 10, b - h); cx.quadraticCurveTo(x - 30, b - h * 0.5, x - 70, b); cx.moveTo(x + 15, b - h); cx.quadraticCurveTo(x + 40, b - h * 0.6, x + 60, b - 40); cx.stroke();
  cx.fillStyle = 'rgba(60,30,30,.5)';
  for (let i = 0; i < 4; i++) { const k = ((T * 0.15 + i / 4) % 1); cx.beginPath(); cx.arc(x + Math.sin(k * 5 + i) * 30 + k * 60, b - h - 20 - k * 160, 18 + k * 30, 0, 7); cx.fill(); }
}
function updAmbient(dt) {
  const fx = stage().fx;
  if (amb.length < 90) {
    if (fx === 'snow') amb.push({ x: rnd(0, W), y: -5, vx: rnd(-25, 25), vy: rnd(30, 70), life: 9, sz: rnd(1.5, 3), col: '#fff' });
    else if (fx === 'sand' && Math.random() < 0.6) amb.push({ x: -10, y: rnd(GY - 220, GY), vx: rnd(250, 450), vy: rnd(-15, 15), life: 3, sz: 1, col: 'rgba(255,215,160,.8)' });
    else if (fx === 'embers' && Math.random() < 0.5) amb.push({ x: rnd(0, W), y: GY, vx: rnd(-20, 20), vy: rnd(-90, -30), life: 4, sz: 2, col: Math.random() < 0.5 ? '#ff8a3a' : '#ffd23b' });
  }
  for (const a of amb) { a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt; if (fx === 'snow') a.vx += Math.sin(T + a.y * 0.02) * 10 * dt; }
  amb = amb.filter(a => a.life > 0 && a.y < GY + 2 && a.x < W + 20);
}
function poly(pts, col) { cx.fillStyle = col; cx.beginPath(); cx.moveTo(-20, GY); for (const p of pts) cx.lineTo(p[0], p[1]); cx.lineTo(W + 40, GY); cx.closePath(); cx.fill(); }

// ================== STICKMAN RENDER ==================
// p: {l1,l2,b1,b2,a1,a2,e1,e2,lean}; angles from straight down, positive = forward
function stick(x, y, s, col, f, p, extra) {
  cx.save(); cx.translate(x, y); cx.scale(s * f, s);
  cx.strokeStyle = col; cx.fillStyle = col; cx.lineWidth = 3.4; cx.lineCap = 'round'; cx.lineJoin = 'round';
  const hx = 0, hy = -20;
  const leg = (a, b) => { const kx = hx + Math.sin(a) * 10, ky = hy + Math.cos(a) * 10; const fx = kx + Math.sin(a - b) * 10, fy = ky + Math.cos(a - b) * 10; cx.moveTo(hx, hy); cx.lineTo(kx, ky); cx.lineTo(fx, fy); };
  const nx = hx + Math.sin(p.lean) * 22, ny = hy - Math.cos(p.lean) * 22;
  const sx = hx + Math.sin(p.lean) * 18, sy = hy - Math.cos(p.lean) * 18;
  let hand = null;
  const arm = (a, b, main) => { const ex = sx + Math.sin(a) * 9, ey = sy + Math.cos(a) * 9; const wx = ex + Math.sin(a + b) * 9, wy = ey + Math.cos(a + b) * 9; cx.moveTo(sx, sy); cx.lineTo(ex, ey); cx.lineTo(wx, wy); if (main) hand = [wx, wy, a + b]; };
  cx.beginPath(); leg(p.l1, p.b1); leg(p.l2, p.b2); cx.moveTo(hx, hy); cx.lineTo(nx, ny); arm(p.a2, p.e2); arm(p.a1, p.e1, true); cx.stroke();
  cx.beginPath(); cx.arc(nx + Math.sin(p.lean) * 7, ny - Math.cos(p.lean) * 7, 7, 0, 7); cx.fill();
  if (extra) extra(hand, nx + Math.sin(p.lean) * 7, ny - Math.cos(p.lean) * 7);
  cx.restore();
}
const POSE = {

};

function tryDash(tx, ty) {
  if (P.ultA) return;

  const cost = 18 * up.cost * (1 - 0.1 * lv('t_cost'));
  if (P.en < cost) { say('Hết năng lượng!', '#7fd4ff', P.x, P.y - 60, 13); return; }
  const sx = P.x, sy = P.y - 25; let dx = tx - sx, dy = ty - sy; const d = Math.hypot(dx, dy) || 1;
  const L = Math.min(d, 250 * up.range); dx /= d; dy /= d;
  let ex = clamp(sx + dx * L, bx0() + 12, bx1() - 12), ey = Math.max(40, sy + dy * L);
  ey = Math.min(ey, floorAt(ex, P.y) - 25);
  [ex, ey] = clipDash(sx, sy, ex, ey);
  P.en -= cost; if (Math.abs(dx) > 0.05) P.f = Math.sign(dx);
  P.dash = { sx, sy, ex, ey, t: 0, d: 0.075 + L / 6000, hit: new Set() };
  bolts.push({ pts: zig(sx, sy, ex, ey, 10, 14), life: 0.25, ml: 0.25, col: '#7fe9ff', w: 3 });

}

function makeCards() {
  // later waves unlock more items, rarer items, and a 4th card from wave 6
  const rw = [60, 22 + wave * 2, wave >= 4 ? 6 + wave * 1.5 : 0, wave >= 6 ? 2 + wave * 0.6 : 0];
  let pool = UPS.filter(u => u.w <= wave && !(u.max && (up.owned[u.id] || 0) >= u.max));
  const n = wave >= 6 ? 4 : 3, gap = 14, cw = Math.min(185, (W - 40 - gap * (n - 1)) / n), ch = 172, tot = cw * n + gap * (n - 1);
  cards = [];
  for (let i = 0; i < n && pool.length; i++) {
    const sum = pool.reduce((a, u) => a + rw[u.r], 0); let r = Math.random() * sum, pick = pool[0];
    for (const u of pool) { r -= rw[u.r]; if (r <= 0) { pick = u; break; } }
    pool = pool.filter(u => u !== pick);
    cards.push({ u: pick, x: W / 2 - tot / 2 + i * (cw + gap), y: H / 2 - ch / 2 + 22, w: cw, h: ch });
  }
}

function draw() {
  cx.setTransform(S, 0, 0, S, 0, 0);
  cx.save();
  if (shake > 0) cx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBG();
  cx.save(); cx.translate(-camX, 0);
  if (LV) drawLevel();

    cx.beginPath(); cx.ellipse(w.x, w.gy || GY, 14, 22, 0, Math.PI, 0); cx.stroke();

  }
  if (quake) {
    const k = quake.life / 1.4, G = quake.gy, lg = cx.createLinearGradient(0, G - 120 * k, 0, G);
    lg.addColorStop(0, 'rgba(255,225,77,0)'); lg.addColorStop(1, 'rgba(255,225,77,' + 0.7 * k + ')');
    cx.fillStyle = lg; cx.fillRect(camX, G - 120 * k, W, 120 * k);
    cx.strokeStyle = 'rgba(255,240,180,' + k + ')'; cx.lineWidth = 3; for (const c of quake.cracks) { path(c); cx.stroke(); }
  }

  for (const m of marks) {
    const k = 1 - m.life / m.ml; cx.globalAlpha = 0.4 + 0.5 * k; cx.strokeStyle = m.col; cx.lineWidth = 3;
    const gy = m.gy || GY;
    cx.beginPath(); cx.ellipse(m.x, gy, 30, 7, 0, 0, 7); cx.stroke(); cx.beginPath(); cx.ellipse(m.x, gy, 30 * k, 7 * k, 0, 0, 7); cx.fillStyle = m.col; cx.fill();
    cx.globalAlpha = 0.12 + 0.2 * k; cx.fillRect(m.x - 14, 0, 28, gy); cx.globalAlpha = 1;
  }
  if (state !== 'menu' && state !== 'levels') {
    for (const e of enemies) drawEnemy(e);

      cx.fillStyle = b.fuse > 0 && Math.floor(T * 14) % 2 ? '#ff3b3b' : '#222'; cx.beginPath(); cx.arc(b.x, b.y, 6, 0, 7); cx.fill();

    for (const a of arrows) if (!a.blade) { const ang = Math.atan2(a.vy, a.vx); cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(a.x - Math.cos(ang) * 18, a.y - Math.sin(ang) * 18); cx.stroke(); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(a.x, a.y, 2, 0, 7); cx.fill(); }

  cx.globalAlpha = 1;

  if (flash > 0) { cx.fillStyle = 'rgba(255,60,80,' + flash * 0.8 + ')'; cx.fillRect(0, 0, W, H); }
  if (wflash > 0) { cx.fillStyle = 'rgba(255,250,220,' + Math.min(1, wflash) + ')'; cx.fillRect(0, 0, W, H); }
  if (P && (state === 'play' || state === 'pause' || state === 'upgrade' || state === 'riddle' || (state === 'tree' && treeBack !== 'levels'))) drawHUD();

}

function scramble(n) { // lights puzzle: each switch flips itself and its neighbours; start from a solvable state

  if (s.every(Boolean)) s[1] = !s[1], s[0] = !s[0], s[2] = !s[2];

}

    fight(n) { ground(580); for (let k = 0; k < n; k++) foe(170 + k * 340 / Math.max(1, n - 1)); item(290, 110, 'orb'); X += 580; },
    pit(w) { ground(150); item(150 + w / 2, 70, 'orb'); if (w > 200) plank(150 + w / 2 - 40, 30, 80); X += 150 + w; ground(170); X += 170; },

    movers() { ground(130); X += 130; const gw = 400; L.movers.push({ x: X + 20, y: G - 30, w: 100, h: 12, x0: X + 20, x1: X + gw - 120, y0: G - 30, y1: G - 30, sp: 120, dir: 1, dx: 0, dy: 0 }); item(gw / 2, 130, 'orb'); X += gw; ground(170); X += 170; },
    elevator() { ground(220); L.movers.push({ x: X + 110, y: G - 10, w: 90, h: 12, x0: X + 110, x1: X + 110, y0: G - 235, y1: G - 10, sp: 95, dir: -1, dx: 0, dy: 0 }); X += 220; ground(320, 225); foe(200, 225); X += 320; ground(150); X += 150; },
    lasers(n) { ground(140 + n * 140); for (let k = 0; k < n; k++) L.lasers.push({ x: X + 120 + k * 140, per: 2.4, on: 1.1, ph: k * 0.7, state: 'off' }); X += 140 + n * 140; },
    lever(n) { ground(580); const g = gate(490, 'lever'); plank(140, 150, 90); g.levers.push(lever(185, 150)); if (n > 1) { plank(300, 230, 80); g.levers.push(lever(340, 230)); } X += 580; },
    riddle() { ground(420); const g = gate(320, 'riddle'); L.stones.push({ x: X + 220, y: G, gate: g, solved: false }); X += 420; },
    lights() { ground(600); const g = gate(500, 'lights'); g.lamps = scramble(4); for (let k = 0; k < 4; k++) L.switches.push({ x: X + 100 + k * 90, y: G, i: k, gate: g, cd: 0 }); X += 600; },

    if (!riddle || !(x > b[0] && x < b[0] + b[2] && y > b[1] && y < b[1] + b[3])) return;
    if (riddle.opts[k] === riddle.r.a) {
      riddle.s.solved = true; openGate(riddle.s.gate); score += 150; sp += 1; saveAdv(); sfx.up();
      say('CHÍNH XÁC! +1 điểm kỹ năng', '#5dff8f', W / 2, H * 0.3, 18); riddle = null; state = 'play';
    } else {
      wrongs++; riddle.until = T + 1.6; P.hp = Math.max(1, P.hp - 10); flash = 0.3; sfx.hurt(); riddle.opts = shuffle(riddle.opts);
    }
  });
}
function drawRiddle() {
  overlay(0.72);
  const [x0, y0, pw, ph] = riddleBox();
  cx.fillStyle = '#161b40'; rr(x0, y0, pw, ph, 16); cx.fill(); cx.strokeStyle = '#ffe14d'; cx.lineWidth = 2.5; cx.stroke();
  txt('❓ CÂU ĐỐ MỞ CỔNG', W / 2, y0 + 34, 20, '#ffe14d');
  wrap(riddle.r.q, W / 2, y0 + 78, pw - 50, 24, 18, '#fff');
  riddleRects().forEach((b, k) => {
    cx.fillStyle = '#26306a'; rr(b[0], b[1], b[2], b[3], 10); cx.fill(); cx.strokeStyle = '#4fd8ff'; cx.lineWidth = 1.5; cx.stroke();
    txt('ABCD'[k] + '. ' + riddle.opts[k], b[0] + b[2] / 2, b[1] + 32, 15, '#fff');
  });
  if (T < riddle.until) txt('Sai rồi! -10 máu — thử lại nhé', W / 2, y0 + ph - 14, 15, '#ff4d6a');
  else txt('Trả lời đúng để mở cổng (+1 điểm kỹ năng)', W / 2, y0 + ph - 14, 12, '#8f99cc', 'center', 'normal');
}

// ---- menu / level select / results ----
function menuBtns() { const y = H * 0.3 + 168; return [[W / 2 - 215, y, 205, 50, 'arena'], [W / 2 + 10, y, 205, 50, 'adv']]; }
function menuTap(x, y) { for (const b of menuBtns()) if (x > b[0] && x < b[0] + b[2] && y > b[1] && y < b[1] + b[3]) return b[4]; return null; }
function lvlRects() {
  const gap = 14, cw = Math.min(180, (W - 40 - gap * 3) / 4), ch = 108, x0 = W / 2 - (cw * 4 + gap * 3) / 2;
  return LEVELS.map((d, k) => [x0 + (k % 4) * (cw + gap), 92 + (k >> 2) * (ch + 14), cw, ch]);
}
function lvlTreeBtn() { return [W / 2 - 120, 344, 240, 38]; }
function levelsTap(x, y) {
  const inside = (b) => x > b[0] && x < b[0] + b[2] && y > b[1] && y < b[1] + b[3];
  if (inside([12, 10, 120, 38])) { MODE = 'arena'; state = 'menu'; return; }
  if (inside(lvlTreeBtn())) { openTree('levels'); return; }
  lvlRects().forEach((b, k) => { if (inside(b) && k < adv.unl) startLevel(k); });
}
function drawLevels() {
  overlay(0.55);
  txt('🗺️ VƯỢT ẢI', W / 2, 44, 26, '#7fe9ff');
  txt('Vừa đánh vừa vượt chướng ngại, giải câu đố để mở cổng', W / 2, 68, 13, '#c9d2ff', 'center', 'normal');
  cx.fillStyle = 'rgba(255,255,255,.12)'; rr(12, 10, 120, 38, 10); cx.fill(); txt('← Menu', 72, 35, 15, '#fff');
  lvlRects().forEach((b, k) => {
    const d = LEVELS[k], st = STAGES[d.stage], open = k < adv.unl, boss = d.chunks.some(c => c[0] === 'arena' && c[2]);
    const g = cx.createLinearGradient(0, b[1], 0, b[1] + b[3]); g.addColorStop(0, st.sky[1]); g.addColorStop(1, st.gr);
    cx.globalAlpha = open ? 1 : 0.45; cx.fillStyle = g; rr(b[0], b[1], b[2], b[3], 12); cx.fill();
    cx.strokeStyle = open ? st.line : '#555'; cx.lineWidth = 2; cx.stroke();
    txt('Ải ' + (k + 1) + (boss ? ' 👑' : ''), b[0] + b[2] / 2, b[1] + 26, 16, '#fff');
    wrap(d.n, b[0] + b[2] / 2, b[1] + 50, b[2] - 12, 15, 12, '#fff');
    const s = adv.stars[k] || 0;
    txt(open ? '★'.repeat(s) + '☆'.repeat(3 - s) : '🔒', b[0] + b[2] / 2, b[1] + 94, 18, open ? '#ffe14d' : '#aaa');
    cx.globalAlpha = 1;
  });
  const tb = lvlTreeBtn(); cx.fillStyle = adv.sp ? '#2e8b57' : '#33385c'; rr(tb[0], tb[1], tb[2], tb[3], 10); cx.fill();
  txt('🌳 Cây kỹ năng · ' + adv.sp + ' điểm', W / 2, tb[1] + 25, 14, '#fff');
}
function advDoneBtns() { return [[W / 2 - 200, H / 2 + 96, 180, 44, 'list'], [W / 2 + 20, H / 2 + 96, 180, 44, 'next']]; }
function advDoneTap(x, y) {
  if (T - cardT < 0.6) return;
  for (const b of advDoneBtns()) if (x > b[0] && x < b[0] + b[2] && y > b[1] && y < b[1] + b[3]) {
    if (b[4] === 'next' && advRes.i + 1 < LEVELS.length) startLevel(advRes.i + 1); else openLevels();
  }
}
function drawAdvDone() {
  overlay(0.72);
  const r = advRes;
  txt('HOÀN THÀNH ẢI ' + (r.i + 1) + '!', W / 2, H / 2 - 120, 30, '#5dff8f');
  txt(LEVELS[r.i].n, W / 2, H / 2 - 94, 15, '#c9d2ff', 'center', 'normal');
  for (let k = 0; k < 3; k++) { const on = k < r.stars; cx.save(); cx.translate(W / 2 + (k - 1) * 56, H / 2 - 44); const sc = on ? 1 + 0.08 * Math.sin(T * 5 + k) : 1; cx.scale(sc, sc); txt(on ? '★' : '☆', 0, 16, 48, on ? '#ffe14d' : '#555'); cx.restore(); }
  const mm = Math.floor(r.t / 60), ss = String(Math.floor(r.t % 60)).padStart(2, '0');
  txt('Thời gian ' + mm + ':' + ss + '  ·  Điểm ' + r.score.toLocaleString('vi-VN') + '  ·  Gục ' + r.deaths + '  ·  Đố sai ' + r.wrongs, W / 2, H / 2 + 22, 14, '#fff', 'center', 'normal');
  txt('+' + r.gain + ' điểm kỹ năng 🌳', W / 2, H / 2 + 50, 16, '#5dff8f');
  txt('3 sao: không gục & không đố sai', W / 2, H / 2 + 72, 11, '#8f99cc', 'center', 'normal');
  for (const b of advDoneBtns()) {
    cx.fillStyle = b[4] === 'next' ? '#2e8b57' : '#33385c'; rr(b[0], b[1], b[2], b[3], 10); cx.fill();
    txt(b[4] === 'next' ? (r.i + 1 < LEVELS.length ? 'Ải tiếp theo ▶' : 'Đã phá đảo! 🏆') : 'Danh sách ải', b[0] + b[2] / 2, b[1] + 28, 15, '#fff');
  }
}

// ---- level rendering ----
function drawLevel() {
  const st = stage(), L = LV, v0 = camX - 60, v1 = camX + W + 60, vis = (x, w) => x < v1 && x + w > v0;
  // abyss below the ground line
  const lg = cx.createLinearGradient(0, GY, 0, H);
  lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, st.kind === 'volcano' ? 'rgba(255,80,20,.9)' : 'rgba(0,0,0,.75)');
  cx.fillStyle = lg; cx.fillRect(camX, GY, W, H - GY);
  // lasers (behind)
  for (const l of L.lasers) if (vis(l.x - 12, 24)) {
    const fl = floorAt(l.x, 0);
    cx.fillStyle = '#4a4f6a'; cx.fillRect(l.x - 11, 0, 22, 16); cx.fillStyle = l.state === 'off' ? '#333' : '#ff3b4f'; cx.fillRect(l.x - 5, 12, 10, 6);
    if (l.state === 'on') {
      cx.strokeStyle = 'rgba(255,40,70,.45)'; cx.lineWidth = 12; cx.beginPath(); cx.moveTo(l.x, 18); cx.lineTo(l.x, fl); cx.stroke();
      cx.strokeStyle = '#fff'; cx.lineWidth = 2.5; cx.stroke();
    } else if (l.state === 'warn' && Math.floor(T * 16) % 2) { cx.strokeStyle = 'rgba(255,60,80,.6)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(l.x, 18); cx.lineTo(l.x, fl); cx.stroke(); }
  }
  // terrain
  for (const s of L.solids) if (vis(s.x, s.w)) {
    cx.fillStyle = st.gr; cx.fillRect(s.x, s.y, s.w, H - s.y + 10);
    cx.strokeStyle = 'rgba(255,255,255,.06)'; cx.lineWidth = 1;
    for (let yy = s.y + 18, r = 0; yy < H; yy += 18, r++) { cx.beginPath(); cx.moveTo(s.x, yy); cx.lineTo(s.x + s.w, yy); cx.stroke(); for (let xx = s.x + (r % 2) * 20 + 20; xx < s.x + s.w; xx += 40) { cx.beginPath(); cx.moveTo(xx, yy - 18); cx.lineTo(xx, yy); cx.stroke(); } }
    cx.strokeStyle = st.line; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x + s.w, s.y); cx.stroke();
    cx.globalAlpha = 0.45; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x, H); cx.moveTo(s.x + s.w, s.y); cx.lineTo(s.x + s.w, H); cx.stroke(); cx.globalAlpha = 1;
  }
  for (const p of [...L.planks, ...L.movers]) if (vis(p.x, p.w)) {
    const mv = p.sp !== undefined;
    cx.fillStyle = st.deco; rr(p.x, p.y, p.w, 12, 4); cx.fill();
    cx.strokeStyle = mv ? '#7fe9ff' : st.line; cx.lineWidth = 2; if (mv) { cx.shadowColor = '#7fe9ff'; cx.shadowBlur = 10; } cx.stroke(); cx.shadowBlur = 0;
    if (mv) { cx.fillStyle = '#7fe9ff'; const ax = p.x + p.w / 2; if (p.x1 !== p.x0) { cx.fillRect(ax - 14, p.y + 5, 28, 2); } else { cx.fillRect(ax - 1, p.y + 2, 2, 8); } }
  }
  for (const s of L.spikes) if (vis(s.x, s.w)) for (let x = s.x; x < s.x + s.w; x += 14) {
    cx.fillStyle = '#cfd6e6'; cx.beginPath(); cx.moveTo(x, s.y); cx.lineTo(x + 7, s.y - 15); cx.lineTo(x + 14, s.y); cx.fill();
    cx.fillStyle = '#ff4d6a'; cx.beginPath(); cx.moveTo(x + 5, s.y - 10); cx.lineTo(x + 7, s.y - 15); cx.lineTo(x + 9, s.y - 10); cx.fill();
  }
  // gates
  for (const g of L.gates) if (g.k < 1 && vis(g.x, g.w)) {
    const top = g.top + (g.bot - g.top) * g.k, col = g.kind === 'riddle' ? '#ffe14d' : g.kind === 'lights' ? '#7fe9ff' : '#ffb347';
    cx.fillStyle = '#262b52'; cx.fillRect(g.x, top, g.w, g.bot - top);
    cx.strokeStyle = col; cx.lineWidth = 2; cx.strokeRect(g.x, top, g.w, g.bot - top);
    cx.globalAlpha = 0.5; for (let yy = top + 24; yy < g.bot; yy += 30) { cx.beginPath(); cx.moveTo(g.x, yy); cx.lineTo(g.x + g.w, yy); cx.stroke(); } cx.globalAlpha = 1;
    if (g.bot - top > 90) txt(g.kind === 'riddle' ? '?' : g.kind === 'lever' ? '⚙' : '💡', g.x + g.w / 2, g.bot - 70, 18, col);
  }
  // levers
  for (const l of L.levers) if (vis(l.x - 20, 40)) {
    cx.fillStyle = '#4a4f6a'; cx.fillRect(l.x - 10, l.y - 8, 20, 8);
    const a = l.on ? 0.6 : -0.6; cx.strokeStyle = '#ccc'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(l.x, l.y - 6); cx.lineTo(l.x + Math.sin(a) * 26, l.y - 6 - Math.cos(a) * 26); cx.stroke();
    cx.fillStyle = l.on ? '#5dff8f' : '#ffb347'; cx.beginPath(); cx.arc(l.x + Math.sin(a) * 26, l.y - 6 - Math.cos(a) * 26, 6, 0, 7); cx.fill();
    if (!l.on) { cx.globalAlpha = 0.4 + 0.3 * Math.sin(T * 6); cx.strokeStyle = '#ffe14d'; cx.lineWidth = 2; cx.beginPath(); cx.arc(l.x, l.y - 22, 24, 0, 7); cx.stroke(); cx.globalAlpha = 1; }
  }
  // light switches + their lamps
  for (const s of L.switches) if (vis(s.x - 20, 40)) {
    const on = s.gate.lamps[s.i], ly = s.y - 150;
    cx.strokeStyle = 'rgba(255,255,255,.2)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(s.x, s.y - 44); cx.lineTo(s.x, ly + 10); cx.stroke();
    if (s.i > 0) { cx.beginPath(); cx.moveTo(s.x - 90 + 10, ly); cx.lineTo(s.x - 10, ly); cx.stroke(); }
    cx.fillStyle = '#2a2f55'; cx.fillRect(s.x - 7, s.y - 40, 14, 40);
    cx.fillStyle = on ? '#ffe14d' : '#556'; cx.beginPath(); cx.moveTo(s.x, s.y - 56); cx.lineTo(s.x + 9, s.y - 44); cx.lineTo(s.x, s.y - 32); cx.lineTo(s.x - 9, s.y - 44); cx.fill();
    if (on) { cx.shadowColor = '#ffe14d'; cx.shadowBlur = 18; }
    cx.fillStyle = on ? '#ffe14d' : '#333a55'; cx.beginPath(); cx.arc(s.x, ly, 10, 0, 7); cx.fill(); cx.shadowBlur = 0;
    cx.strokeStyle = '#7fe9ff'; cx.lineWidth = 1.5; cx.stroke();
  }
  // riddle stones
  for (const s of L.stones) if (vis(s.x - 30, 60)) {
    cx.fillStyle = '#3a2f6a'; rr(s.x - 15, s.y - 60, 30, 60, 6); cx.fill();
    cx.strokeStyle = s.solved ? '#5dff8f' : '#ffe14d'; cx.lineWidth = 2; cx.stroke();
    if (!s.solved) { cx.shadowColor = '#ffe14d'; cx.shadowBlur = 12 + 6 * Math.sin(T * 4); }
    txt(s.solved ? '✓' : '?', s.x, s.y - 22, 26, s.solved ? '#5dff8f' : '#ffe14d'); cx.shadowBlur = 0;
  }
  // pickups
  for (const it of L.items) if (!it.taken && vis(it.x - 20, 40)) {
    const y = it.y + Math.sin(T * 3 + it.b) * 4;
    if (it.k === 'orb') { cx.shadowColor = '#4fd8ff'; cx.shadowBlur = 14; cx.fillStyle = '#4fd8ff'; cx.beginPath(); cx.arc(it.x, y, 8, 0, 7); cx.fill(); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(it.x - 2, y - 2, 3, 0, 7); cx.fill(); cx.shadowBlur = 0; }
    else txt('❤', it.x, y + 7, 20, '#ff4d6a');
  }
  // checkpoints
  for (const c of L.checks) if (vis(c.x - 10, 50)) {
    cx.strokeStyle = '#ccc'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(c.x, c.y); cx.lineTo(c.x, c.y - 70); cx.stroke();
    const wv = Math.sin(T * 6) * 4; cx.fillStyle = c.on ? '#5dff8f' : '#8f99cc';
    cx.beginPath(); cx.moveTo(c.x, c.y - 70); cx.lineTo(c.x + 30, c.y - 62 + wv); cx.lineTo(c.x, c.y - 52); cx.fill();
  }
  // exit portal
  if (L.exit && vis(L.exit.x - 40, 80)) {
    const e = L.exit, open = !L.lock;
    cx.globalAlpha = open ? 1 : 0.35;
    for (let k = 0; k < 4; k++) { cx.strokeStyle = k % 2 ? '#7fe9ff' : '#c27bff'; cx.lineWidth = 3; cx.beginPath(); cx.ellipse(e.x, e.y - 48, 26 - k * 5, 48 - k * 9, 0, T * (2 + k) % 6.28, T * (2 + k) % 6.28 + 4.5); cx.stroke(); }
    txt('THOÁT', e.x, e.y - 108, 14, '#7fe9ff'); cx.globalAlpha = 1;
  }
  // arena barriers
  if (L.lock) for (const x of [L.lock.x0 - 6, L.lock.x1 + 6]) {
    cx.strokeStyle = 'rgba(255,60,90,' + (0.5 + 0.3 * Math.sin(T * 12)) + ')'; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, GY); cx.stroke();
    cx.strokeStyle = '#fff'; cx.lineWidth = 1.5; cx.stroke();
  }
}

// ================== LOOP ==================
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (hitstop > 0) { hitstop -= dt; T += dt; } else update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
