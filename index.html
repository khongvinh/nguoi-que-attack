<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let DPR = 1, S = 1, W = 800, H = 450, GY = 390;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  H = 450; S = cv.height / H; W = cv.width / S;
  if (W < 640) { W = 640; S = cv.width / W; H = cv.height / S; }
  GY = H - 60;
  makeScenery();
}
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let k = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; k = clamp(k, 0, 1);
  return Math.hypot(px - (ax + dx * k), py - (ay + dy * k));
}

// ================== AUDIO ==================
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f1, f2, dur, type, vol) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!AC) return; const t = AC.currentTime, n = AC.sampleRate * dur | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq; s.buffer = b; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
const sfx = {
  zap() { tone(1800, 200, 0.12, 'sawtooth', 0.05); noise(0.08, 0.08, 6000); },
  hit() { noise(0.1, 0.25, 2500); tone(300, 80, 0.08, 'square', 0.05); },
  kill() { tone(600, 60, 0.25, 'square', 0.06); noise(0.2, 0.2, 1500); },
  hurt() { tone(180, 50, 0.3, 'sawtooth', 0.12); },
  slam() { noise(0.5, 0.5, 400); tone(90, 30, 0.5, 'sine', 0.3); },
  up() { tone(400, 1200, 0.25, 'triangle', 0.08); },
  shoot() { tone(900, 500, 0.08, 'triangle', 0.04); },
  pick() { tone(500, 900, 0.1, 'triangle', 0.07); tone(900, 1300, 0.1, 'sine', 0.04); },
  toss() { noise(0.12, 0.12, 3000); tone(500, 250, 0.12, 'triangle', 0.05); },
  ult() { tone(90, 30, 1.2, 'sawtooth', 0.25); noise(1.1, 0.7, 700); tone(1600, 100, 0.6, 'square', 0.05); },
  charge() { tone(150, 1400, 0.45, 'sawtooth', 0.07); },
  cast() { tone(300, 900, 0.3, 'sine', 0.06); },
  bomb() { noise(0.35, 0.4, 900); tone(120, 40, 0.3, 'sine', 0.2); },
  block() { tone(1200, 1500, 0.15, 'square', 0.05); noise(0.1, 0.15, 5000); },
};

// ================== SCENERY ==================
// stages change every 5 waves (the 5th wave of each is the boss)
const STAGES = [
  { n: 'Đêm Trăng', sky: ['#0b0f24', '#1d2350', '#3a3d7a'], orb: '#e8eeff', glow: '200,220,255', h1: '#262b5c', h2: '#171a3d', deco: '#1e2250', gr: '#0e1030', line: '#5a63c9', kind: 'towers', fx: 'stars',
    pool: { grunt: 3, archer: 2, bat: 2, brute: 1 }, boss: { n: 'CHÚA TỂ BÓNG ĐÊM', col: '#ff2d55', moves: ['swing', 'slam', 'charge', 'bdash'] } },
  { n: 'Sa Mạc Hoàng Hôn', sky: ['#2a1240', '#a8436a', '#ff9a5a'], orb: '#ffd27a', glow: '255,180,90', h1: '#7a3b4f', h2: '#4a2240', deco: '#5a2a48', gr: '#2a1428', line: '#ff9a5a', kind: 'pyramids', fx: 'sand',
    pool: { grunt: 2, archer: 1, bomber: 2, ninja: 2, brute: 1 }, boss: { n: 'VUA CÁT', col: '#ffb347', moves: ['swing', 'charge', 'bdash', 'bthrow', 'slam'] } },
  { n: 'Rừng Băng', sky: ['#08162e', '#2d5c8a', '#9fd3ef'], orb: '#f0fbff', glow: '200,240,255', h1: '#5c86b0', h2: '#33557a', deco: '#24466a', gr: '#16253d', line: '#bfefff', kind: 'pines', fx: 'snow',
    pool: { shield: 2, archer: 1, bat: 2, mage: 2, ninja: 1, grunt: 1, brute: 1 }, boss: { n: 'HIỆP SĨ BĂNG', col: '#7fe9ff', moves: ['swing', 'bdash', 'bthrow', 'bdive', 'slam', 'combo'] } },
  { n: 'Núi Lửa', sky: ['#1a0505', '#5a1010', '#d4471a'], orb: '#ff5a3a', glow: '255,90,40', h1: '#3a0f0f', h2: '#250808', deco: '#2e0b0b', gr: '#170505', line: '#ff6a2a', kind: 'volcano', fx: 'embers',
    pool: { grunt: 1, archer: 1, bomber: 2, ninja: 2, shield: 2, mage: 2, brute: 2, bat: 1 }, boss: { n: 'QUỶ LỬA', col: '#ff6a2a', moves: ['swing', 'charge', 'bdash', 'bthrow', 'bdive', 'combo', 'slam'] } },
];
const ALL_MOVES = ['swing', 'charge', 'bdash', 'bthrow', 'bdive', 'combo', 'slam'];
function stageIdx(w) { return Math.floor((Math.max(1, w) - 1) / 5); }
function stage() { return STAGES[stageIdx(wave) % STAGES.length]; }
let stars = [], hills1 = [], hills2 = [], towers = [], pyramids = [], amb = [];
function makeScenery() {
  pyramids = [[W * 0.18, 110, 120], [W * 0.38, 70, 75], [W * 0.62, 130, 140], [W * 0.88, 80, 85]];
  stars = []; for (let i = 0; i < 90; i++) stars.push([Math.random() * W, Math.random() * GY * 0.75, Math.random() * 1.5 + 0.3, Math.random() * 6]);
  hills1 = []; hills2 = [];
  for (let x = -20; x <= W + 40; x += 40) { hills1.push([x, GY - 90 - Math.sin(x * 0.006) * 40 - Math.random() * 20]); hills2.push([x, GY - 40 - Math.sin(x * 0.011 + 2) * 22 - Math.random() * 10]); }
  towers = []; for (let x = 20; x < W; x += rnd(30, 70)) towers.push([x, rnd(20, 60), rnd(12, 26)]);
}
function drawBG() {
  const st = stage();
  const g = cx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, st.sky[0]); g.addColorStop(0.6, st.sky[1]); g.addColorStop(1, st.sky[2]);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  if (st.fx === 'stars' || st.fx === 'snow') {
    for (const s of stars) { cx.globalAlpha = (st.fx === 'snow' ? 0.25 : 0.4) + 0.5 * Math.abs(Math.sin(T * 0.8 + s[3])); cx.fillStyle = '#fff'; cx.fillRect(s[0], s[1] * 0.7, s[2], s[2]); }
    cx.globalAlpha = 1;
  }
  // moon / sun
  const sun = st.kind === 'pyramids', mx = W * (sun ? 0.7 : 0.78), my = GY * (sun ? 0.55 : 0.28), mr = sun ? 52 : 32;
  const mg = cx.createRadialGradient(mx, my, 10, mx, my, mr * 3); mg.addColorStop(0, 'rgba(' + st.glow + ',.4)'); mg.addColorStop(1, 'rgba(' + st.glow + ',0)');
  cx.fillStyle = mg; cx.beginPath(); cx.arc(mx, my, mr * 3, 0, 7); cx.fill();
  cx.fillStyle = st.orb; cx.beginPath(); cx.arc(mx, my, mr, 0, 7); cx.fill();
  if (st.kind === 'towers') { cx.fillStyle = '#cdd6f5'; cx.beginPath(); cx.arc(mx - 9, my - 6, 6, 0, 7); cx.arc(mx + 10, my + 9, 4, 0, 7); cx.fill(); }
  if (st.kind === 'volcano') drawVolcano(st);
  poly(hills1, st.h1);
  cx.fillStyle = st.deco;
  if (st.kind === 'towers') for (const t of towers) cx.fillRect(t[0], GY - 40 - t[1], t[2], t[1] + 40);
  else if (st.kind === 'pyramids') for (const [x, w, h] of pyramids) {
    cx.fillStyle = st.deco; cx.beginPath(); cx.moveTo(x - w, GY - 20); cx.lineTo(x, GY - 20 - h); cx.lineTo(x + w, GY - 20); cx.fill();
    cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.moveTo(x, GY - 20 - h); cx.lineTo(x + w, GY - 20); cx.lineTo(x + w * 0.2, GY - 20); cx.fill();
  }
  else if (st.kind === 'pines') for (const t of towers) {
    const x = t[0], h = t[1] + 40, b = GY - 30;
    for (let i = 0; i < 3; i++) { const yy = b - i * h * 0.3, ww = (3 - i) * 9 + 4; cx.beginPath(); cx.moveTo(x - ww, yy); cx.lineTo(x, yy - h * 0.45); cx.lineTo(x + ww, yy); cx.fill(); }
  }
  poly(hills2, st.h2);
  // ground
  cx.fillStyle = st.gr; cx.fillRect(0, GY, W, H - GY);
  cx.strokeStyle = st.line; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0, GY); cx.lineTo(W, GY); cx.stroke();
  cx.globalAlpha = 0.15; cx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { cx.beginPath(); cx.moveTo(x, GY + 4); cx.lineTo(x - 20, H); cx.stroke(); }
  cx.globalAlpha = 1;
  // weather
  for (const a of amb) { cx.globalAlpha = Math.min(1, a.life) * 0.7; cx.fillStyle = a.col; if (st.fx === 'sand') cx.fillRect(a.x, a.y, 7, 1); else cx.fillRect(a.x, a.y, a.sz, a.sz); }
  cx.globalAlpha = 1;
}
function drawVolcano(st) {
  const x = W * 0.3, b = GY - 30, h = 190, w = 230;
  cx.fillStyle = '#2a0909'; cx.beginPath(); cx.moveTo(x - w, b); cx.lineTo(x - 30, b - h); cx.lineTo(x + 30, b - h); cx.lineTo(x + w, b); cx.fill();
  const lg = cx.createRadialGradient(x, b - h, 5, x, b - h, 70); lg.addColorStop(0, 'rgba(255,160,40,.9)'); lg.addColorStop(1, 'rgba(255,60,20,0)');
  cx.fillStyle = lg; cx.beginPath(); cx.arc(x, b - h, 70, 0, 7); cx.fill();
  cx.strokeStyle = '#ff6a2a'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(x - 10, b - h); cx.quadraticCurveTo(x - 30, b - h * 0.5, x - 70, b); cx.moveTo(x + 15, b - h); cx.quadraticCurveTo(x + 40, b - h * 0.6, x + 60, b - 40); cx.stroke();
  cx.fillStyle = 'rgba(60,30,30,.5)';
  for (let i = 0; i < 4; i++) { const k = ((T * 0.15 + i / 4) % 1); cx.beginPath(); cx.arc(x + Math.sin(k * 5 + i) * 30 + k * 60, b - h - 20 - k * 160, 18 + k * 30, 0, 7); cx.fill(); }
}
function updAmbient(dt) {
  const fx = stage().fx;
  if (amb.length < 90) {
    if (fx === 'snow') amb.push({ x: rnd(0, W), y: -5, vx: rnd(-25, 25), vy: rnd(30, 70), life: 9, sz: rnd(1.5, 3), col: '#fff' });
    else if (fx === 'sand' && Math.random() < 0.6) amb.push({ x: -10, y: rnd(GY - 220, GY), vx: rnd(250, 450), vy: rnd(-15, 15), life: 3, sz: 1, col: 'rgba(255,215,160,.8)' });
    else if (fx === 'embers' && Math.random() < 0.5) amb.push({ x: rnd(0, W), y: GY, vx: rnd(-20, 20), vy: rnd(-90, -30), life: 4, sz: 2, col: Math.random() < 0.5 ? '#ff8a3a' : '#ffd23b' });
  }
  for (const a of amb) { a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt; if (fx === 'snow') a.vx += Math.sin(T + a.y * 0.02) * 10 * dt; }
  amb = amb.filter(a => a.life > 0 && a.y < GY + 2 && a.x < W + 20);
}
function poly(pts, col) { cx.fillStyle = col; cx.beginPath(); cx.moveTo(-20, GY); for (const p of pts) cx.lineTo(p[0], p[1]); cx.lineTo(W + 40, GY); cx.closePath(); cx.fill(); }

// ================== STICKMAN RENDER ==================
// p: {l1,l2,b1,b2,a1,a2,e1,e2,lean}; angles from straight down, positive = forward
function stick(x, y, s, col, f, p, extra) {
  cx.save(); cx.translate(x, y); cx.scale(s * f, s);
  cx.strokeStyle = col; cx.fillStyle = col; cx.lineWidth = 3.4; cx.lineCap = 'round'; cx.lineJoin = 'round';
  const hx = 0, hy = -20;
  const leg = (a, b) => { const kx = hx + Math.sin(a) * 10, ky = hy + Math.cos(a) * 10; const fx = kx + Math.sin(a - b) * 10, fy = ky + Math.cos(a - b) * 10; cx.moveTo(hx, hy); cx.lineTo(kx, ky); cx.lineTo(fx, fy); };
  const nx = hx + Math.sin(p.lean) * 22, ny = hy - Math.cos(p.lean) * 22;
  const sx = hx + Math.sin(p.lean) * 18, sy = hy - Math.cos(p.lean) * 18;
  let hand = null;
  const arm = (a, b, main) => { const ex = sx + Math.sin(a) * 9, ey = sy + Math.cos(a) * 9; const wx = ex + Math.sin(a + b) * 9, wy = ey + Math.cos(a + b) * 9; cx.moveTo(sx, sy); cx.lineTo(ex, ey); cx.lineTo(wx, wy); if (main) hand = [wx, wy, a + b]; };
  cx.beginPath(); leg(p.l1, p.b1); leg(p.l2, p.b2); cx.moveTo(hx, hy); cx.lineTo(nx, ny); arm(p.a2, p.e2); arm(p.a1, p.e1, true); cx.stroke();
  cx.beginPath(); cx.arc(nx + Math.sin(p.lean) * 7, ny - Math.cos(p.lean) * 7, 7, 0, 7); cx.fill();
  if (extra) extra(hand, nx + Math.sin(p.lean) * 7, ny - Math.cos(p.lean) * 7);
  cx.restore();
}
const POSE = {
  idle: (t) => ({ l1: 0.25, b1: -0.1, l2: -0.2, b2: -0.1, a1: 0.5 + Math.sin(t * 3) * 0.05, e1: 0.6, a2: -0.3, e2: 0.4, lean: 0.05 }),

  dash: () => ({ l1: -1.1, b1: -0.6, l2: -0.6, b2: -0.9, a1: -2.3, e1: 0.2, a2: -2.0, e2: 0.2, lean: 1.05 }),

  throw: () => ({ l1: 0.6, b1: 0.2, l2: -0.5, b2: -0.3, a1: 2.2, e1: -0.2, a2: -0.9, e2: 0.4, lean: 0.3 }),

  fist: () => ({ l1: 0.5, b1: 1.4, l2: -0.2, b2: 1.5, a1: 3.05, e1: 0, a2: 2.9, e2: 0, lean: -0.1 }),
  smash: () => ({ l1: -0.4, b1: 0.3, l2: -0.8, b2: 0.3, a1: 0.15, e1: 0, a2: 0.25, e2: 0, lean: 0.25 }),
};

let wave = 0, score = 0, combo = 0, comboT = 0, maxCombo = 0, shake = 0, hitstop = 0, toSpawn = [], spawnT = 0, clearT = 0, overT = 0, flash = 0, banner = 0, skyT = 3, hint = 0, ultNext = 100, wflash = 0, seen = new Set(), hintQ = [];

function newGame() {
  P = { x: W / 2, y: GY, vx: 0, vy: 0, hp: 100, mhp: 100, en: 100, men: 100, f: 1, dash: null, slashT: 0, inv: 0, hurtT: 0, anim: 0, moving: false,
    wpn: null, shield: false, shT: 0, ult: false, ultA: null };
  enemies = []; arrows = []; parts = []; texts = []; bolts = []; waves = []; afterimg = []; drops = []; thrown = []; rings = []; bombs = []; marks = []; quake = null;
  wave = 0; score = 0; combo = 0; maxCombo = 0; queued = null; skyT = 3; hint = 0; ultNext = 100; seen = new Set(); hintQ = [];
  up = { dmg: 1, range: 1, cost: 1, regen: 1, chain: 0, ls: 0, crit: 0.12, throwDmg: 1, dura: 1, drop: 1, magnet: 0, shield: 0, vamp: 0,
    armory: 0, multi: 1, storm: 0, sky: 0, ret: 0, rage: 0, revive: 0, owned: {} };
  nextWave(); state = 'play';
}
function nextWave() {
  wave++; banner = (wave - 1) % 5 === 0 ? 3 : 2; toSpawn = []; spawnT = 1;
  if (up.armory && !P.wpn) { const ks = Object.keys(WEAPONS); equip(ks[Math.random() * ks.length | 0]); }
  if (up.shield) P.shield = true;
  const m = 1 + (wave - 1) * 0.12, si = stageIdx(wave), st = stage();
  // weighted pool for this stage; the first stage introduces its enemies one wave at a time
  const pool = [];
  for (const [k, wgt] of Object.entries(st.pool)) {
    if (si === 0 && ((k === 'archer' && wave < 2) || (k === 'bat' && wave < 3) || (k === 'brute' && wave < 4))) continue;
    for (let i = 0; i < wgt; i++) pool.push(k);
  }
  const pick = () => pool[Math.random() * pool.length | 0];
  if (wave % 5 === 0) {
    toSpawn.push({ type: 'boss', m: 1 + si * 0.6, si });
    for (let i = 0; i < si + 2; i++) toSpawn.push({ type: pick(), m });
  } else {
    const n = Math.min(3 + wave * 2, 28);
    for (let i = 0; i < n; i++) toSpawn.push({ type: pick(), m });
  }
}
function spawn(o) {
  const t = TYPES[o.type], side = Math.random() < 0.5 ? -1 : 1;
  const e = { type: o.type, x: side < 0 ? -40 : W + 40, y: t.fly ? rnd(GY - 220, GY - 110) : GY, vx: 0, vy: 0, hp: t.hp * o.m, mhp: t.hp * o.m, s: t.s, col: t.col, f: -side,
    atkCd: rnd(0.5, 1.5), wind: 0, swing: 0, hitT: 0, stun: 0, anim: Math.random() * 9, entered: false, act: null, actT: 0, air: false, ph: Math.random() * 6,
    poseN: 0, turnT: 0.7, castT: 0, tp: 0, recover: 0, ghosts: [] };
  e.r = o.type === 'bat' ? 14 : 15 * e.s;
  if (t.hover) { e.hy = rnd(GY - 190, GY - 120); e.y = e.hy; }
  if (o.type === 'boss') { const B = STAGES[o.si % STAGES.length].boss; e.col = B.col; e.name = B.n; e.moves = o.si >= STAGES.length ? ALL_MOVES : B.moves; }
  if (HINTS[o.type] && !seen.has(o.type)) { seen.add(o.type); hintQ.push(HINTS[o.type]); }
  enemies.push(e);
}

// ================== INPUT ==================
function toWorld(ev) { return [ev.clientX * DPR / S, ev.clientY * DPR / S]; }
cv.addEventListener('pointerdown', (ev) => {
  ev.preventDefault(); initAudio();
  const [x, y] = toWorld(ev);
  if (state === 'menu') { newGame(); return; }
  if (state === 'over') { if (overT > 0.8) newGame(); return; }
  if (state === 'upgrade') {
    if (T - cardT < 0.4) return; // avoid picking a card with the tap that finished the wave
    for (const c of cards) if (x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h) {
      up.owned[c.u.id] = (up.owned[c.u.id] || 0) + 1; c.u.f(); sfx.up(); P.hp = Math.min(P.mhp, P.hp + 15); nextWave(); state = 'play'; break;
    }
    return;
  }
  if (state === 'play') {
    if (x > W - 54 && y < 54) { state = 'pause'; return; }
    const [bx, by] = throwBtn();
    if (P.wpn && Math.hypot(x - bx, y - by) < 46) { throwWeapon(); return; }
    if (ev.button === 2) { throwWeapon(x, y); return; }
    tryDash(x, y);
  }
  else if (state === 'pause') state = 'play';
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('pointermove', (ev) => { mouse = toWorld(ev); });
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if ((e.key === 'f' || e.key === 'F') && state === 'play') throwWeapon();
  if ((e.key === 'p' || e.key === 'Escape') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  if (e.key === ' ' && state === 'play') { // dash toward nearest enemy
    let n = null, nd = 1e9; for (const en of enemies) { const d = Math.abs(en.x - P.x); if (d < nd) { nd = d; n = en; } }
    if (n) tryDash(n.x, n.y - 28 * n.s); else tryDash(P.x + P.f * 200, P.y - 25);
  }
});
addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

function tryDash(tx, ty) {
  if (P.ultA) return;
  if (P.dash) { queued = [tx, ty]; return; }
  const cost = 18 * up.cost;
  if (P.en < cost) { say('Hết năng lượng!', '#7fd4ff', P.x, P.y - 60, 13); return; }
  const sx = P.x, sy = P.y - 25; let dx = tx - sx, dy = ty - sy; const d = Math.hypot(dx, dy) || 1;
  const L = Math.min(d, 250 * up.range); dx /= d; dy /= d;
  const ex = clamp(sx + dx * L, 12, W - 12), ey = clamp(sy + dy * L, 40, GY - 25);
  P.en -= cost; if (Math.abs(dx) > 0.05) P.f = Math.sign(dx);
  P.dash = { sx, sy, ex, ey, t: 0, d: 0.075 + L / 6000, hit: new Set() };
  bolts.push({ pts: zig(sx, sy, ex, ey, 10, 14), life: 0.25, ml: 0.25, col: '#7fe9ff', w: 3 });
  sfx.zap();
}
// ================== WEAPONS ==================
let cardT = 0;
function throwBtn() { return [W - 66, H - 66]; }
function say(s, col, x, y, sz) { if (texts.some(t => t.s === s && t.life > 0.4)) return; texts.push({ x: x ?? P.x, y: y ?? P.y - 70, s, col: col || '#fff', life: 1, vy: -35, sz: sz || 14 }); }
function dmgMult() { return up.dmg * (up.rage && combo >= 10 ? 1.5 : 1); }
function fullDur(k) { return Math.max(1, Math.round(WEAPONS[k].dur * up.dura)); }
function equip(k, dur) {
  dur = dur || fullDur(k);
  if (P.wpn && P.wpn.k === k) { P.wpn.dur += dur; say('+' + WEAPONS[k].n, WEAPONS[k].col); return; }
  if (P.wpn) addDrop(P.wpn.k, P.x, P.y - 20, P.wpn.dur, 0.9);
  P.wpn = { k, dur };
  say(WEAPONS[k].ic + ' ' + WEAPONS[k].n, WEAPONS[k].col, P.x, P.y - 70, 16);
  if (hint < 1) { hint = 1; say('Bấm NÉM để phóng vũ khí!', '#ffe14d', W / 2, H * 0.45, 18); }
  sfx.pick();
}
function addDrop(k, x, y, dur, cool) {
  drops.push({ k, x: clamp(x, 20, W - 20), y, vy: -240, vx: rnd(-60, 60), dur: dur || fullDur(k), life: 10 + up.magnet * 4, cool: cool || 0, bob: Math.random() * 6 });
}
function nearestEnemies() {
  return enemies.filter(e => e.hp > 0 && e.entered).map(e => { const c = eCenter(e); return { e, c, d: Math.hypot(c[0] - P.x, c[1] - P.y + 34) }; }).sort((a, b) => a.d - b.d);
}
function throwWeapon(tx, ty) {
  if (P.ultA) return;
  if (!P.wpn) { say('Chưa có vũ khí — hạ địch để nhặt!', '#8fa3d9'); return; }
  const k = P.wpn.k, sx = P.x, sy = P.y - 34, list = nearestEnemies();
  const targets = [];
  if (tx !== undefined) targets.push([tx, ty]);
  for (const o of list) targets.push(o.c);
  if (!targets.length) targets.push([sx + P.f * 400, sy]);
  const n = up.multi; // the original + copies
  for (let i = 0; i < n; i++) {
    const t = targets[i] || [targets[0][0], targets[0][1] - 40 * i];
    launch(k, sx, sy, t[0], t[1], i > 0, P.wpn.dur);
  }
  P.f = Math.sign(targets[0][0] - sx) || P.f;
  if (WEAPONS[k].ammo) { P.wpn.dur--; if (P.wpn.dur <= 0) P.wpn = null; } else P.wpn = null;
  P.slashT = 0.2; sfx.toss();
}
function launch(k, sx, sy, tx, ty, ghost, dur) {
  const w = WEAPONS[k], d = Math.hypot(tx - sx, ty - sy), t = clamp(d / w.sp, 0.12, 1.1);
  thrown.push({ k, x: sx, y: sy, vx: (tx - sx) / t, vy: (ty - sy) / t - 0.5 * w.g * t, rot: 0, hit: new Set(), ghost, dur, mode: 'fly', life: 3 });
}
function boom(x, y) {
  shake = Math.max(shake, 12); sfx.slam();
  for (const e of enemies) { const [ex, ey] = eCenter(e); if (Math.hypot(ex - x, ey - y) < 95) { hitEnemy(e, 30 * dmgMult() * up.throwDmg, Math.sign(ex - x) || 1, 0, true); e.stun = Math.max(e.stun, 0.8); } }
  rings.push({ x, y, life: 0.35 });
  for (let i = 0; i < 26; i++) { const a = i / 26 * 6.28; parts.push({ x, y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.4, ml: 0.4, col: '#a99cff', sz: 3, g: 0 }); }
}
function endThrow(p) { // weapon hit something: break, return, or fall to the ground as a pickup
  if (WEAPONS[p.k].ammo || p.ghost) { p.dead = true; sparks(p.x, p.y, WEAPONS[p.k].col, 6); return; }
  p.dur--;
  if (p.dur <= 0) { p.dead = true; sparks(p.x, p.y, '#ccc', 14); say(WEAPONS[p.k].n + ' đã gãy!', '#ff8fa3', p.x, p.y - 20, 13); return; }
  if (up.ret) { p.mode = 'ret'; p.hit = new Set(); return; }
  p.mode = 'fall'; p.vx *= -0.25; p.vy = -220;
}
function sparks(x, y, col, n) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-200, 200), vy: rnd(-220, 60), life: 0.35, ml: 0.35, col, sz: 2.5, g: 500 }); }

function updWeapons(dt) {
  // thrown weapons
  for (const p of thrown) {
    const w = WEAPONS[p.k]; p.life -= dt;
    if (p.mode === 'ret') {
      const dx = P.x - p.x, dy = P.y - 34 - p.y, d = Math.hypot(dx, dy) || 1, x0 = p.x, y0 = p.y;
      p.vx = dx / d * 820; p.vy = dy / d * 820; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += 22 * dt;
      for (const e of enemies) { if (p.hit.has(e) || e.hp <= 0) continue; const [ex, ey] = eCenter(e); if (segDist(ex, ey, x0, y0, p.x, p.y) < e.r + 12) { p.hit.add(e); hitEnemy(e, w.td * 0.6 * dmgMult() * up.throwDmg, Math.sign(p.vx) || 1, 0); } }
      if (d < 28 || p.life < -3) { p.dead = true; if (!P.wpn || P.wpn.k === p.k) { if (P.wpn) P.wpn.dur += p.dur; else { P.wpn = { k: p.k, dur: p.dur }; } sfx.pick(); } else addDrop(p.k, P.x, P.y - 20, p.dur, 0.9); }
      continue;
    }
    if (p.mode === 'fall') {
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += 10 * dt;
      if (p.y >= GY - 6) { p.dead = true; addDrop(p.k, p.x, GY - 6, p.dur); }
      continue;
    }
    const x0 = p.x, y0 = p.y;
    p.vy += w.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot = w.spin ? p.rot + w.spin * dt * Math.sign(p.vx || 1) : Math.atan2(p.vy, p.vx);
    for (const e of enemies) {
      if (p.hit.has(e) || e.hp <= 0) continue;
      const [ex, ey] = eCenter(e);
      if (segDist(ex, ey, x0, y0, p.x, p.y) < e.r + 10) {
        p.hit.add(e); hitEnemy(e, w.td * dmgMult() * up.throwDmg, Math.sign(p.vx) || 1, 0);
        if (w.boom) { boom(p.x, p.y); p.boomed = true; }
        if (!w.pierce) { endThrow(p); break; }
      }
    }
    for (const a of arrows) if (!a.dead && segDist(a.x, a.y, x0, y0, p.x, p.y) < 14) { a.dead = true; sparks(a.x, a.y, '#ffe14d', 5); }
    if (p.mode === 'fly' && !p.dead && (p.y >= GY - 4 || p.x < 8 || p.x > W - 8 || p.life <= 0)) {
      p.x = clamp(p.x, 8, W - 8); p.y = Math.min(p.y, GY - 4);
      if (w.boom && !p.boomed) boom(p.x, p.y);
      if (w.pierce && !p.ghost && !up.ret && p.y >= GY - 4) { p.dead = true; p.dur--; if (p.dur > 0) addDrop(p.k, p.x, GY - 6, p.dur); }
      else endThrow(p);
    }
  }
  thrown = thrown.filter(p => !p.dead);

  // weapons lying on the ground
  const pull = up.magnet ? 70 + up.magnet * 90 : 0;
  for (const d of drops) {
    if (d.dead) continue;
    d.life -= dt; d.cool -= dt; d.vy += 900 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.vx *= Math.pow(0.05, dt);
    if (d.y > GY - 6) { d.y = GY - 6; d.vy = 0; }
    if (d.cool > 0) continue;
    const can = !P.wpn || P.wpn.k === d.k, dx = P.x - d.x, dist = Math.hypot(dx, P.y - 20 - d.y);
    if (can && pull && dist < pull) { d.x += dx / (dist || 1) * 380 * dt; }
    if (can && Math.abs(dx) < 26 && Math.abs(P.y - 10 - d.y) < 45) { d.dead = true; equip(d.k, d.dur); }
  }
  drops = drops.filter(d => !d.dead && d.life > 0);

  // passive items
  if (up.shield && !P.shield) { P.shT -= dt; if (P.shT <= 0) { P.shield = true; say('🛡️ Khiên sẵn sàng', '#4fd8ff'); } }
  if (up.sky && enemies.length) {
    skyT -= dt;
    if (skyT <= 0) {
      skyT = 4 / (1 + 0.35 * (up.sky - 1));
      const live = enemies.filter(e => e.hp > 0 && e.entered);
      if (live.length) {
        const e = live[Math.random() * live.length | 0], [ex, ey] = eCenter(e);
        bolts.push({ pts: zig(ex + rnd(-30, 30), 0, ex, ey, 12, 18), life: 0.35, ml: 0.35, col: '#ffe14d', w: 4 });
        shake = Math.max(shake, 5); sfx.zap();
        hitEnemy(e, 30 * dmgMult(), 1, 0, true);
      }
    }
  }
}
function zig(ax, ay, bx, by, n, amp) {
  const pts = [[ax, ay]], dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy) || 1, px = -dy / l, py = dx / l;
  for (let i = 1; i < n; i++) { const k = i / n, o = rnd(-amp, amp); pts.push([ax + dx * k + px * o, ay + dy * k + py * o]); }
  pts.push([bx, by]); return pts;

function eCenter(e) { return e.type === 'bat' ? [e.x, e.y] : [e.x, e.y - 30 * e.s]; }

  texts.push({ x: ex + rnd(-8, 8), y: ey - 20 * e.s, s: Math.round(dmg) + (crit ? '!' : ''), col: crit ? '#ffe14d' : '#fff', life: 0.7, vy: -70, sz: crit ? 22 : 16 });

  }
}
function killEnemy(e, dir) {

  texts.push({ x: ex, y: ey - 40 * e.s, s: '+' + pts, col: '#ffe14d', life: 0.9, vy: -50, sz: 14 });

// ================== ULTIMATE (100 combo, triggered while airborne) ==================

function ultBoom() {

// ================== UPDATE ==================
function update(dt) {
  T += dt;
  updAmbient(dt);
  if (hintQ.length && state === 'play' && !texts.some(t => t.hint)) texts.push({ x: W / 2, y: H * 0.42, s: hintQ.shift(), col: '#ffe14d', life: 3, vy: -6, sz: 15, hint: 1 });
  wflash = Math.max(0, wflash - dt * 1.5);
  if (quake) { quake.life -= dt; if (quake.life <= 0) quake = null; }
  for (const p of parts) { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.y += t.vy * dt; t.life -= dt; } texts = texts.filter(t => t.life > 0);
  for (const b of bolts) b.life -= dt; bolts = bolts.filter(b => b.life > 0);
  for (const a of afterimg) a.life -= dt; afterimg = afterimg.filter(a => a.life > 0);
  shake = Math.max(0, shake - 40 * dt); flash = Math.max(0, flash - dt); banner = Math.max(0, banner - dt);
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  // ---- player ----
  P.inv -= dt; P.hurtT -= dt; P.slashT -= dt; P.anim += dt;
  P.en = Math.min(P.men, P.en + 32 * up.regen * dt);
  if (P.ult && !P.ultA && !P.dash && P.y < GY - 35) startUlt();
  if (P.ultA) updUlt(dt);
  else if (P.dash) {
    const D = P.dash; const k0 = Math.min(1, D.t / D.d); D.t += dt; const k = Math.min(1, D.t / D.d);
    const ax = lerp(D.sx, D.ex, k0), ay = lerp(D.sy, D.ey, k0), bx = lerp(D.sx, D.ex, k), by = lerp(D.sy, D.ey, k);
    P.x = bx; P.y = by + 25;
    afterimg.push({ x: P.x, y: P.y, f: P.f, life: 0.18 });
    for (const e of enemies) {
      if (D.hit.has(e) || e.hp <= 0) continue;
      const [ex, ey] = eCenter(e);
      const w = P.wpn && !WEAPONS[P.wpn.k].ammo ? WEAPONS[P.wpn.k] : null;
      if (segDist(ex, ey, ax, ay, bx, by) < e.r + 16 + (w && w.reach || 0)) { D.hit.add(e); hitEnemy(e, 20 * dmgMult() * (w ? w.m : 1), P.f, up.chain); }
    }
    for (const d of drops) if (d.cool <= 0 && !d.dead && segDist(d.x, d.y, ax, ay, bx, by) < 32) { d.dead = true; equip(d.k, d.dur); }
    for (const b of bombs) if (!b.dead && segDist(b.x, b.y, ax, ay, bx, by) < 24) { b.dead = true; score += 5; sparks(b.x, b.y, '#ffd23b', 10); say('ĐÁ VĂNG!', '#ffd23b', b.x, b.y - 20, 12); }
    for (const a of arrows) if (!a.dead && segDist(a.x, a.y, ax, ay, bx, by) < 20) { a.dead = true; score += 5; for (let i = 0; i < 6; i++) parts.push({ x: a.x, y: a.y, vx: rnd(-150, 150), vy: rnd(-150, 50), life: 0.3, ml: 0.3, col: '#ffe14d', sz: 2, g: 300 }); }
    if (k >= 1) {
      P.dash = null; P.slashT = 0.2; P.vx = 0; P.vy = P.y < GY - 2 ? -160 : 0; P.inv = Math.max(P.inv, 0.12);
      if (D.hit.size && P.wpn && !WEAPONS[P.wpn.k].ammo && --P.wpn.dur <= 0) { sparks(P.x, P.y - 30, '#ccc', 14); say(WEAPONS[P.wpn.k].n + ' đã gãy!', '#ff8fa3'); P.wpn = null; }
      if (up.storm) {
        const cx0 = P.x, cy0 = P.y - 25, R = 70 + 15 * up.storm;
        for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28 + rnd(0, 1); bolts.push({ pts: zig(cx0, cy0, cx0 + Math.cos(a) * R, cy0 + Math.sin(a) * R, 4, 8), life: 0.2, ml: 0.2, col: '#c27bff', w: 2 }); }
        for (const e of enemies) { const [ex, ey] = eCenter(e); if (Math.hypot(ex - cx0, ey - cy0) < R + e.r) hitEnemy(e, 10 * up.storm * dmgMult(), Math.sign(ex - cx0) || 1, 0, true); }

    }

    P.vy += 1500 * dt; P.x += (P.vx + mv * 230) * dt; P.y += P.vy * dt; P.vx *= Math.pow(0.02, dt);

  const maxAlive = 4 + Math.floor(wave * 0.8);
  if (toSpawn.length && spawnT <= 0 && enemies.length < maxAlive) { spawn(toSpawn.shift()); spawnT = Math.max(0.35, 1.4 - wave * 0.08); }

  // ---- enemies ----
  for (const e of enemies) updEnemy(e, dt);
  enemies = enemies.filter(e => e.hp > 0);

  // ---- arrows ----
  for (const a of arrows) {
    a.vy += 160 * dt; a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt; if (a.blade) a.rot += 20 * dt;
    if (Math.hypot(a.x - P.x, a.y - (P.y - 28)) < (a.blade ? 24 : 18)) { a.dead = true; hurtPlayer(a.dmg || TYPES.archer.dmg, Math.sign(a.vx)); }

        for (let i = 0; i < 18; i++) parts.push({ x: b.x, y: b.y, vx: rnd(-260, 260), vy: rnd(-320, -40), life: 0.5, ml: 0.5, col: i % 2 ? '#ffd23b' : '#ff6a2a', sz: 3, g: 600 });

  } else clearT = 0;
}

function updEnemy(e, dt) {
  const t = TYPES[e.type];

  const dx = P.x - e.x, dist = Math.abs(dx);

  if (e.type === 'bat') {
    e.stun -= dt;
    if (e.stun <= 0) {
      const tx = P.x, ty = P.y - 34 + Math.sin(e.anim * 3 + e.ph) * 20;
      const ang = Math.atan2(ty - e.y, tx - e.x), sp = e.atkCd > 0 ? -60 : t.sp;
      e.vx = lerp(e.vx, Math.cos(ang) * sp + Math.sin(e.anim * 2 + e.ph) * 60, 3 * dt);
      e.vy = lerp(e.vy, Math.sin(ang) * sp, 3 * dt);

    e.x += e.vx * dt; e.y += e.vy * dt; e.y = clamp(e.y, 40, GY - 10);

    if (e.tp > 0) { e.tp -= dt; if (e.tp <= 0) { sparks(e.x, e.y - 30, e.col, 12); e.x = rnd(60, W - 60); e.hy = rnd(GY - 190, GY - 110); e.y = e.hy; sparks(e.x, e.y - 30, e.col, 12); } }

      rings.push({ x: e.x, y: GY, life: 0.35, R: 110, col: e.col });

      waves.push({ x: e.x - 30, dir: -1, life: 1.8 }, { x: e.x + 30, dir: 1, life: 1.8 });
      for (let i = 0; i < 30; i++) parts.push({ x: e.x + rnd(-40, 40), y: GY, vx: rnd(-250, 250), vy: rnd(-300, -50), life: 0.6, ml: 0.6, col: '#8a7cff', sz: 3, g: 800 });

  if (e.type !== 'boss' && e.hp < e.mhp) {
    const [ex, ey] = eCenter(e), w = 26 * e.s, y = ey - 30 * e.s - (e.type === 'bat' ? -12 : 0);
    cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(ex - w / 2, y, w, 4); cx.fillStyle = e.col; cx.fillRect(ex - w / 2, y, w * Math.max(0, e.hp / e.mhp), 4);
  }
}
function drawBolt(b) {
  const a = b.life / b.ml;
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.strokeStyle = b.col; cx.globalAlpha = a * 0.35; cx.lineWidth = b.w * 4; path(b.pts); cx.stroke();
  cx.globalAlpha = a; cx.strokeStyle = '#fff'; cx.lineWidth = b.w; path(b.pts); cx.stroke();
  cx.globalAlpha = 1;
}
function path(pts) { cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]); }

function bar(x, y, w, h, k, col, bg) { cx.fillStyle = bg; rr(x, y, w, h, h / 2); cx.fill(); if (k > 0) { cx.fillStyle = col; rr(x, y, Math.max(h, w * k), h, h / 2); cx.fill(); } }
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function txt(s, x, y, sz, col, al, wt) { cx.font = (wt || 'bold') + ' ' + sz + 'px "Segoe UI",Roboto,sans-serif'; cx.textAlign = al || 'center'; cx.fillStyle = col; cx.fillText(s, x, y); }

function drawHUD() {
  const pad = 16;
  bar(pad, pad, 190, 14, P.hp / P.mhp, P.hp / P.mhp < 0.3 ? '#ff4d6a' : '#5dff8f', 'rgba(0,0,0,.45)');
  txt(Math.ceil(P.hp) + '/' + P.mhp, pad + 95, pad + 11, 10, '#0b0f24');
  bar(pad, pad + 20, 150, 9, P.en / P.men, '#4fd8ff', 'rgba(0,0,0,.45)');
  txt('Đợt ' + wave, W - 70, pad + 14, 16, '#fff', 'right');
  txt(score.toLocaleString('vi-VN') + ' điểm', W - 70, pad + 34, 13, '#ffe14d', 'right');
  // held weapon + shield
  if (P.wpn) { const w = WEAPONS[P.wpn.k]; txt(w.ic + ' ' + w.n + (w.ammo ? ' x' + P.wpn.dur : ' · bền ' + P.wpn.dur), pad, pad + 46, 13, w.col, 'left'); }
  else txt('Tay không (katana)', pad, pad + 46, 12, '#8fa3d9', 'left', 'normal');
  if (up.shield) txt(P.shield ? '🛡️' : '🛡️ ' + Math.ceil(P.shT) + 's', pad + 198, pad + 13, 13, P.shield ? '#4fd8ff' : '#667', 'left');
  // throw button
  const [bx, by] = throwBtn(), on = !!P.wpn;
  cx.fillStyle = on ? 'rgba(79,216,255,.22)' : 'rgba(255,255,255,.08)'; cx.beginPath(); cx.arc(bx, by, 38, 0, 7); cx.fill();
  cx.strokeStyle = on ? WEAPONS[P.wpn.k].col : 'rgba(255,255,255,.25)'; cx.lineWidth = 2.5; cx.stroke();
  if (on) { cx.save(); cx.translate(bx - 8, by - 4); cx.rotate(-0.7); cx.translate(-14, 0); wDraw(P.wpn.k); cx.restore(); }
  txt('NÉM', bx, by + 26, 11, on ? '#fff' : 'rgba(255,255,255,.4)');
  if (on && WEAPONS[P.wpn.k].ammo) txt('x' + P.wpn.dur, bx + 24, by - 20, 12, '#ffe14d');
  // pause btn
  cx.fillStyle = 'rgba(255,255,255,.15)'; rr(W - 50, 10, 38, 38, 10); cx.fill(); cx.fillStyle = '#fff'; cx.fillRect(W - 37, 21, 4, 16); cx.fillRect(W - 29, 21, 4, 16);
  if (combo >= 3) {
    const k = Math.min(1, comboT / 2.5), sz = 22 + Math.min(combo, 50) * 0.3;
    cx.globalAlpha = 0.4 + 0.6 * k;
    txt(combo + ' COMBO', W / 2, 46, sz, combo >= 20 ? '#ff5df0' : combo >= 10 ? '#ffe14d' : '#7fe9ff');
    txt('x' + (1 + Math.min(combo, 60) / 10).toFixed(1) + ' điểm', W / 2, 64, 11, '#fff', 'center', 'normal');
    cx.globalAlpha = 1;
  }
  // ultimate meter
  const prog = P.ult ? 1 : clamp(1 - (ultNext - combo) / 100, 0, 1), uw = 150;
  bar(W / 2 - uw / 2, 74, uw, 7, prog, P.ult ? (Math.sin(T * 10) > 0 ? '#ffe14d' : '#fff') : '#ffb84d', 'rgba(0,0,0,.45)');
  txt(P.ult ? '⚡ CHIÊU CUỐI SẴN SÀNG — LƯỚT LÊN KHÔNG!' : 'Chiêu cuối ' + Math.round(prog * 100) + '/100 combo', W / 2, 94, 10, P.ult ? '#ffe14d' : '#c9d2ff', 'center', P.ult ? 'bold' : 'normal');
  const boss = enemies.find(e => e.type === 'boss');
  if (boss) { const w = Math.min(420, W * 0.6); txt(boss.name, W / 2, H - 30, 12, boss.col); bar(W / 2 - w / 2, H - 22, w, 10, boss.hp / boss.mhp, boss.col, 'rgba(0,0,0,.5)'); }
  if (banner > 0) {
    cx.globalAlpha = Math.min(1, banner * 2);
    const si = stageIdx(wave), st = stage();
    if ((wave - 1) % 5 === 0) { txt('MÀN ' + (si + 1) + ': ' + st.n.toUpperCase(), W / 2, H * 0.33, 32, st.line); txt('Đợt ' + wave, W / 2, H * 0.33 + 28, 16, '#fff'); }
    else if (wave % 5 === 0) txt('ĐỢT ' + wave + ' — TRÙM ' + st.boss.n + '!', W / 2, H * 0.35, 28, st.boss.col);
    else txt('ĐỢT ' + wave, W / 2, H * 0.35, 34, '#fff');
    cx.globalAlpha = 1;
  }
}

function overlay(a) { cx.fillStyle = 'rgba(5,7,20,' + a + ')'; cx.fillRect(0, 0, W, H); }
function drawMenu() {
  overlay(0.35);
  const y0 = H * 0.3;
  cx.shadowColor = '#4fd8ff'; cx.shadowBlur = 20;
  txt('NGƯỜI QUE', W / 2, y0, 52, '#fff'); txt('TẤN CÔNG', W / 2, y0 + 50, 40, '#7fe9ff');
  cx.shadowBlur = 0;
  stick(W / 2, y0 + 150, 1.6, '#fff', 1, POSE.idle(T));
  if (Math.sin(T * 4) > -0.3) txt('Chạm để bắt đầu', W / 2, y0 + 200, 20, '#ffe14d');
  txt('Chạm để lướt · Nhặt & ném vũ khí · 100 combo + bay trên không = CHIÊU CUỐI', W / 2, y0 + 232, 13, '#c9d2ff', 'center', 'normal');
  txt('Máy tính: chuột để lướt · A/D di chuyển · W nhảy · Space lướt tới địch gần nhất · F / chuột phải: ném', W / 2, y0 + 252, 11, '#8f99cc', 'center', 'normal');
  if (best) txt('Kỷ lục: ' + best.toLocaleString('vi-VN'), W / 2, y0 + 278, 14, '#fff');
  if (innerHeight > innerWidth) txt('↻ Xoay ngang điện thoại để chơi tốt hơn', W / 2, H - 30, 14, '#ff8fa3', 'center', 'normal');
}
function drawUpgrade() {
  overlay(0.6);
  txt('ĐỢT ' + wave + ' HOÀN THÀNH!', W / 2, H / 2 - 95, 30, '#5dff8f');
  txt('Chọn một vật phẩm (+15 máu)' + (wave >= 6 ? ' · 4 lựa chọn' : ''), W / 2, H / 2 - 68, 14, '#c9d2ff', 'center', 'normal');
  for (const c of cards) {
    const rc = RAR[c.u.r].c, cxm = c.x + c.w / 2;
    cx.fillStyle = '#1b2150'; rr(c.x, c.y, c.w, c.h, 14); cx.fill();
    if (c.u.r >= 2) { cx.shadowColor = rc; cx.shadowBlur = 10 + 6 * Math.sin(T * 4); }
    cx.strokeStyle = rc; cx.lineWidth = c.u.r ? 3 : 2; cx.stroke(); cx.shadowBlur = 0;
    txt(RAR[c.u.r].n.toUpperCase(), cxm, c.y + 18, 10, rc);
    txt(c.u.ic, cxm, c.y + 56, 28, '#fff');
    const own = up.owned[c.u.id] || 0;
    txt(c.u.n + (own ? ' (cấp ' + (own + 1) + ')' : ''), cxm, c.y + 88, 14, '#fff');
    wrap(c.u.d, cxm, c.y + 110, c.w - 18, 15, 12, '#c9d2ff');
  }
  const own = UPS.filter(u => up.owned[u.id]).map(u => u.ic + (up.owned[u.id] > 1 ? '×' + up.owned[u.id] : '')).join('  ');
  if (own) txt('Đã có: ' + own, W / 2, H / 2 + 128, 13, '#c9d2ff', 'center', 'normal');
}
function wrap(s, x, y, mw, lh, sz, col) {
  cx.font = sz + 'px "Segoe UI",Roboto,sans-serif'; const words = s.split(' '); let line = '';
  for (const w of words) { const tl = line ? line + ' ' + w : w; if (cx.measureText(tl).width > mw && line) { txt(line, x, y, sz, col, 'center', 'normal'); line = w; y += lh; } else line = tl; }
  txt(line, x, y, sz, col, 'center', 'normal');
}
function drawOver() {
  overlay(Math.min(0.7, overT));
  txt('THẤT BẠI', W / 2, H * 0.3, 46, '#ff4d6a');
  txt('Điểm: ' + score.toLocaleString('vi-VN'), W / 2, H * 0.3 + 46, 22, '#ffe14d');
  txt('Màn ' + (stageIdx(wave) + 1) + ' · Đợt ' + wave + ' · Combo cao nhất ' + maxCombo, W / 2, H * 0.3 + 74, 15, '#fff', 'center', 'normal');
  txt((score >= best && score > 0 ? '★ KỶ LỤC MỚI ★ ' : 'Kỷ lục: ') + best.toLocaleString('vi-VN'), W / 2, H * 0.3 + 100, 15, '#7fe9ff');
  if (overT > 0.8 && Math.sin(T * 4) > -0.3) txt('Chạm để chơi lại', W / 2, H * 0.3 + 145, 20, '#fff');
}

function draw() {
  cx.setTransform(S, 0, 0, S, 0, 0);
  cx.save();
  if (shake > 0) cx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBG();
  for (const w of waves) {
    cx.globalAlpha = Math.min(1, w.life); cx.strokeStyle = '#a99cff'; cx.lineWidth = 4;
    cx.beginPath(); cx.ellipse(w.x, GY, 14, 22, 0, Math.PI, 0); cx.stroke();
    cx.fillStyle = 'rgba(169,156,255,.3)'; cx.fill(); cx.globalAlpha = 1;
  }
  if (quake) {
    const k = quake.life / 1.4, lg = cx.createLinearGradient(0, GY - 120 * k, 0, GY);
    lg.addColorStop(0, 'rgba(255,225,77,0)'); lg.addColorStop(1, 'rgba(255,225,77,' + 0.7 * k + ')');
    cx.fillStyle = lg; cx.fillRect(0, GY - 120 * k, W, 120 * k);
    cx.strokeStyle = 'rgba(255,240,180,' + k + ')'; cx.lineWidth = 3; for (const c of quake.cracks) { path(c); cx.stroke(); }
  }
  for (const m of marks) {
    const k = 1 - m.life / m.ml; cx.globalAlpha = 0.4 + 0.5 * k; cx.strokeStyle = m.col; cx.lineWidth = 3;
    cx.beginPath(); cx.ellipse(m.x, GY, 30, 7, 0, 0, 7); cx.stroke(); cx.beginPath(); cx.ellipse(m.x, GY, 30 * k, 7 * k, 0, 0, 7); cx.fillStyle = m.col; cx.fill();
    cx.globalAlpha = 0.12 + 0.2 * k; cx.fillRect(m.x - 14, 0, 28, GY); cx.globalAlpha = 1;
  }
  if (state !== 'menu') {
    for (const e of enemies) drawEnemy(e);
    for (const b of bombs) {
      cx.fillStyle = b.fuse > 0 && Math.floor(T * 14) % 2 ? '#ff3b3b' : '#222'; cx.beginPath(); cx.arc(b.x, b.y, 6, 0, 7); cx.fill();
      cx.strokeStyle = '#ffd23b'; cx.lineWidth = 1.5; cx.stroke();
      if (b.fuse > 0) { cx.globalAlpha = 0.25; cx.strokeStyle = '#ff3b3b'; cx.beginPath(); cx.arc(b.x, b.y, 65, Math.PI, 0); cx.stroke(); cx.globalAlpha = 1; }
    }
    for (const a of arrows) if (a.blade) {
      cx.save(); cx.translate(a.x, a.y); cx.rotate(a.rot); cx.fillStyle = a.col; cx.shadowColor = a.col; cx.shadowBlur = 10;
      cx.beginPath(); for (let i = 0; i < 8; i++) { const an = i / 8 * 6.283, r = i % 2 ? 4 : 13; cx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } cx.fill(); cx.restore();
    }
    cx.strokeStyle = '#ffd27a'; cx.lineWidth = 2;
    for (const a of arrows) if (!a.blade) { const ang = Math.atan2(a.vy, a.vx); cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(a.x - Math.cos(ang) * 18, a.y - Math.sin(ang) * 18); cx.stroke(); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(a.x, a.y, 2, 0, 7); cx.fill(); }
    drawItems();
    drawPlayer();
  }
  for (const b of bolts) drawBolt(b);
  for (const p of parts) { cx.globalAlpha = Math.max(0, p.life / p.ml); cx.fillStyle = p.col; cx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  cx.globalAlpha = 1;
  for (const t of texts) { cx.globalAlpha = Math.min(1, t.life * 2); cx.lineWidth = 3; cx.strokeStyle = '#0b0f24'; cx.font = 'bold ' + t.sz + 'px sans-serif'; cx.textAlign = 'center'; const tx = clamp(t.x, 50, W - 50); cx.strokeText(t.s, tx, t.y); cx.fillStyle = t.col; cx.fillText(t.s, tx, t.y); }
  cx.globalAlpha = 1;
  cx.restore();
  if (flash > 0) { cx.fillStyle = 'rgba(255,60,80,' + flash * 0.8 + ')'; cx.fillRect(0, 0, W, H); }
  if (wflash > 0) { cx.fillStyle = 'rgba(255,250,220,' + Math.min(1, wflash) + ')'; cx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'pause' || state === 'upgrade') drawHUD();
  if (state === 'menu') drawMenu();
  else if (state === 'upgrade') drawUpgrade();
  else if (state === 'over') drawOver();
  else if (state === 'pause') { overlay(0.55); txt('TẠM DỪNG', W / 2, H / 2, 36, '#fff'); txt('Chạm để tiếp tục', W / 2, H / 2 + 34, 15, '#c9d2ff', 'center', 'normal'); }
}

// ================== LOOP ==================
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (hitstop > 0) { hitstop -= dt; T += dt; } else update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
